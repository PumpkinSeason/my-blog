---
layout: default
---

<article class="post wrap">
  <header class="post-header">
    {%- if page.kicker %}
    <p class="kicker">{{ page.kicker }}</p>
    {%- endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {%- if page.description %}
    <p class="lede">{{ page.description }}</p>
    {%- endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
