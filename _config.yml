title: My Blog
brand: pumpkin_season
description: A notebook, mostly.

author:
  name: pumpkin_season

url: "https://pumpkinseason.github.io"
baseurl: ""

lang: en

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

exclude:
  - README.md
  - README-FOR-ME.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
