<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="mark" aria-hidden="true"></span>
      <span>{{ site.brand | default: site.title }}</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.collection == 'posts' %} aria-current="page"{% endif %}>blog</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>about</a>
      <a href="{{ '/issues/' | relative_url }}"{% if page.url == '/issues/' %} aria-current="page"{% endif %}>issues</a>
      <a href="{{ '/feed.xml' | relative_url }}" class="nav-rss">rss</a>

      <div class="switch" role="radiogroup" aria-label="Colour scheme">
        <input type="radio" name="scheme" id="scheme-day" value="day">
        <label for="scheme-day" aria-label="Day">day</label>
        <input type="radio" name="scheme" id="scheme-evening" value="evening">
        <label for="scheme-evening" aria-label="Evening">evening</label>
        <input type="radio" name="scheme" id="scheme-night" value="night" checked>
        <label for="scheme-night" aria-label="Night">night</label>
      </div>
    </nav>
  </div>
</header>
