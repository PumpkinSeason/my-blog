<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- if page.title and page.url != "/" -%}
  <title>{{ page.title }} · {{ site.title }}</title>
  {%- else -%}
  <title>{{ site.title }}</title>
  {%- endif -%}

  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta name="theme-color" content="#0d1216">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <script>
    (function () {
      var root = document.documentElement;
      var stored = null;
      try { stored = localStorage.getItem('scheme'); } catch (e) {}
      var legacy = { light: 'evening', dark: 'night' };
      if (stored && legacy[stored]) stored = legacy[stored];
      if (stored) root.dataset.scheme = stored;

      document.addEventListener('DOMContentLoaded', function () {
        if (stored) {
          var saved = document.getElementById('scheme-' + stored);
          if (saved) saved.checked = true;
        }
        var inputs = document.querySelectorAll('.switch input');
        Array.prototype.forEach.call(inputs, function (input) {
          input.addEventListener('change', function () {
            root.dataset.scheme = input.value;
            try { localStorage.setItem('scheme', input.value); } catch (e) {}
          });
        });
      });
    })();
  </script>

  <style>
    /* paint the canvas before the stylesheet arrives, in the right colour */
    html { background: #0d1216; }
    html[data-scheme="day"] { background: #ffffff; }
    html[data-scheme="evening"] { background: #f7f3eb; }
  </style>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
